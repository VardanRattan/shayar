# Cache Folder
$shayar_cache_folder = $HOME/.cache/shayar/hyprland-dotfiles

# Source colors and design tokens
source = colors.conf
source = ~/.config/shayar/themes/design-tokens-hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $shayar_cache_folder/blurred_wallpaper.png   # only png supported for now
}

input-field {
    monitor =
    size = $dt-spacing-hyprlock-combined-input-size
    dots_size = $dt-spacing-hyprlock-dots-size
    dots_spacing = $dt-spacing-hyprlock-dots-spacing
    dots_center = true
    dots_rounding = $dt-spacing-hyprlock-dots-rounding
    inner_color = $primary
    font_color = $on_primary
    font_family = $dt-typography-hyprlock-font
    outer_color = $on_primary
    outline_thickness = $dt-spacing-hyprlock-outline-thickness
    fade_on_empty = true
    fade_timeout = $dt-spacing-hyprlock-fade-timeout
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = $dt-spacing-hyprlock-input-rounding
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = $dt-spacing-hyprlock-combined-input-position
    halign = center
    valign = center
    shadow_passes = $dt-spacing-hyprlock-input-shadow-passes
    shadow_size = $dt-spacing-hyprlock-input-shadow-size
    shadow_color = $shadow
    shadow_boost = $dt-spacing-hyprlock-input-shadow-boost
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = $primary
    font_size = $dt-typography-hyprlock-clock-size
    font_family = $dt-typography-hyprlock-font
    position = $dt-spacing-hyprlock-combined-clock-position
    halign = right
    valign = bottom
    shadow_passes = $dt-spacing-hyprlock-clock-shadow-passes
    shadow_size = $dt-spacing-hyprlock-clock-shadow-size
}

label {
    monitor =
    text = $USER
    color = $primary
    font_size = $dt-typography-hyprlock-user-size
    font_family = $dt-typography-hyprlock-font
    position = $dt-spacing-hyprlock-combined-user-position
    halign = right
    valign = bottom
    shadow_passes = $dt-spacing-hyprlock-user-shadow-passes
    shadow_size = $dt-spacing-hyprlock-user-shadow-size
}

image {
    monitor =
    path = $shayar_cache_folder/square_wallpaper.png
    size = $dt-spacing-hyprlock-image-size
    rounding = $dt-spacing-hyprlock-image-rounding
    border_size = $dt-spacing-hyprlock-image-border-size
    border_color = $primary $on_primary 90deg
    rotate = 0
    reload_time = -1
    position = $dt-spacing-hyprlock-combined-image-position
    halign = center
    valign = center
    shadow_passes = $dt-spacing-hyprlock-image-shadow-passes
    shadow_size = $dt-spacing-hyprlock-image-shadow-size
    shadow_color = $shadow
    shadow_boost = $dt-spacing-hyprlock-image-shadow-boost
}
