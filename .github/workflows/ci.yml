name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Git (required for checkout)
        run: pacman -Sy --noconfirm git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm jq lua shellcheck luarocks gcc make sudo
          luarocks install luacheck

      - name: Run smoke tests
        run: bash scripts/test.sh

      - name: Create non-root user for installation
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Run install.sh (Integration Test)
        run: su builder -c "bash scripts/install.sh"
