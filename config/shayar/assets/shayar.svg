<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep blue sumi ink style gradient for the V -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6985a9" />
      <stop offset="100%" stop-color="#3c577a" />
    </linearGradient>
    <!-- Muted nature green for the Punjabi/Urdu scripts -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fbd74" />
      <stop offset="100%" stop-color="#5a8b41" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(256, 260)" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif">
    <!-- Scaled up V to tightly fit the 512x512 canvas with minimal padding -->
    <text x="0" y="30" font-weight="900" font-size="480" fill="url(#blueGrad)" filter="url(#shadow)">V</text>
    
    <!-- Scaled up Punjabi letter -->
    <text x="0" y="-120" font-weight="800" font-size="160" fill="url(#greenGrad)" filter="url(#shadow)">ਸ਼</text>
    
    <!-- Scaled up Urdu letter -->
    <text x="0" y="20" font-weight="800" font-size="160" fill="url(#greenGrad)" filter="url(#shadow)">ش</text>
  </g>
</svg>
