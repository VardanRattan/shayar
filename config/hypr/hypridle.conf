general {
    lock_cmd = qs -c caelestia ipc call lock lock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = brightnessctl -r
}

listener {
    timeout = 150                                # 2.5min (dim backlight to save battery)
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum
    on-resume = brightnessctl -r                 # monitor backlight restore
}

listener {
    timeout = 300                                # 5min (lock session)
    on-timeout = qs -c caelestia ipc call lock lock # lock screen with Caelestia
}

listener {
    timeout = 360                                                     # 6min (display & GPU sleep)
    on-timeout = hyprctl dispatch dpms off                            # GPU and monitor sleep when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r          # wake display and restore brightness on activity
}

listener {
    timeout = 1800                                # 30min
    # on-timeout = systemctl suspend                # suspend pc (commented out to prevent freeze/stopping background tasks)
}
